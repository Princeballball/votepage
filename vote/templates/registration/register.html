{% extends 'base.html' %}

{% block title %}註冊｜投個時間{% endblock %}

{% block content %}
    <section class="auth">
        <h1>註冊</h1>

        <form method="post">
            {% csrf_token %}

            {% for field in form %}
                <label>
                    {{ field.label }}
                    {{ field }}

                    {% for error in field.errors %}
                        <span class="field-error">{{ error }}</span>
                    {% endfor %}

                    {% if field.help_text %}
                        <small>{{ field.help_text|safe }}</small>
                    {% endif %}
                </label>
            {% endfor %}

            <button class="primary wide" type="submit">註冊</button>
        </form>

        <p class="muted">
            已有帳號？<a href="{% url 'login' %}">登入</a>
        </p>
    </section>
{% endblock %}
